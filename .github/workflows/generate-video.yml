
name: RK Market Talk Video Generator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Video
        run: |
          python video.py

      - name: Upload Generated Video
        uses: actions/upload-artifact@v4
        with:
          name: RK-Market-Talk-Video
          path: output.mp4
          retention-days: 1
          if-no-files-found: error
